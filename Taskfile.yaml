# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

version: '3'

includes:
  json: https://raw.githubusercontent.com/Terradue/taskfile-utils/refs/heads/main/json.yaml
  quality: https://raw.githubusercontent.com/Terradue/taskfile-utils/refs/heads/main/quality.yaml
  openapi: https://raw.githubusercontent.com/Terradue/taskfile-utils/refs/heads/main/openapi.yaml

tasks:

  install_prerequisites:
    cmds:
    - npm i -g @redocly/cli@latest
    - pip install openapi-python-client mkdocs-material mkdocs-mermaid2-plugin mkdocs-jupyter legacy-cgi pdocs mkdocs-build-plantuml-plugin

  default:
    cmds:
    - task: openapi:bundle
      vars:
        API: ./docs/openapi/invenio.yaml
        OUTPUT: ./docs/openapi/invenio_bundled.yaml
    - task: openapi:generate_docs
      vars:
        API: ./docs/openapi/invenio_bundled.yaml
        OUTPUT: ./docs/openapi/invenio.html
    - task: openapi:generate_client
      vars:
        API: ./docs/openapi/invenio_bundled.yaml
    - rm -rf ./src/invenio_rest_api_client/models
    - task: json:create_models
      vars:
        INPUT_FILE_TYPE: 'openapi'
        SCHEMA: './docs/openapi/invenio_bundled.yaml'
        OUTPUT: './src/invenio_rest_api_client/models.py'
