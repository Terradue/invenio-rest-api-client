site_name: Invenio REST API Client
site_description: Typed Python client for the InvenioRDM REST API
site_url: https://terradue.github.io/invenio-rest-api-client/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/Terradue/invenio-rest-api-client/
repo_name: Terradue/invenio-rest-api-client

theme:
  name: readthedocs
  logo: imgs/icon-eoap.png
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorials:
      - Create your first record: tutorials/first-record.md
  - How-to guides:
      - Authenticate: how-to/authenticate.md
      - Search and retrieve records: how-to/search-records.md
      - Create and publish a record: how-to/create-and-publish.md
  - Reference:
      - Record APIs: reference/records.md
      - Client configuration: reference/client.md
      - Enhanced OpenAPI: openapi/invenio.html
      - ./reference/invenio-v12.0.3-openapi-audit.md
  - Explanation:
      - Why schemas were reconstructed: explanation/schema-reconstruction.md

